networks:
  traefik:
    external: true
  gitea:
    external: false
services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # Go reads SSL_CERT_FILE; the shared bundle carries the system roots
      # plus Yiklek CA, so the host's /etc/ssl/certs mount is no longer needed.
      - SSL_CERT_FILE=/ca/ca-bundle.crt
    restart: unless-stopped
    networks:
      - gitea
      - traefik
    volumes:
      - ${GITEA_DATA}:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_BASE}/ca:/ca:ro
    ports:
      #- "3001:3000"
      - "222:22"
    dns:
      - ${DNS:?set DNS in the root .env}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`gitea.${DOMAIN}`)"
      - "traefik.http.routers.gitea.service=gitea"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
